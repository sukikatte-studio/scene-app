<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sukikatte Studio</title>
<style>
:root{
  --bg:#0b0f19;
  --panel:#151c2c;
  --panel-2:#1d2638;
  --panel-3:#121826;
  --text:#f3f4f6;
  --sub:#9ca3af;
  --line:#334155;
  --green:#22c55e;
  --blue:#2563eb;
  --gray:#475569;
  --red:#ef4444;
  --orange:#f59e0b;
  --purple:#7c3aed;
  --teal:#0f766e;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}
.app{
  max-width:980px;
  margin:auto;
  padding:16px;
}
.app-header{
  margin-bottom:16px;
}
.app-header h1{
  margin:0 0 6px;
  font-size:32px;
}
.subtitle{
  margin:0;
  color:var(--sub);
  font-size:14px;
}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
}
h2{
  margin:0 0 14px;
  font-size:22px;
}
.field{
  margin-bottom:12px;
}
label{
  display:block;
  margin-bottom:6px;
  color:var(--sub);
  font-size:13px;
}
input,textarea,select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--panel-2);
  color:var(--text);
  font-size:16px;
  font-family:inherit;
}
textarea{
  min-height:100px;
  resize:vertical;
}
.button-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:8px;
}
.button-row button{
  flex:1 1 180px;
}
button{
  padding:12px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  color:white;
  font-size:15px;
  font-family:inherit;
}
.primary-btn{background:var(--green);}
.secondary-btn{background:var(--gray);}
.select-btn{background:var(--blue);}
.danger-btn{background:var(--red);}
.edit-btn{background:var(--orange);}
.detail-btn{background:var(--teal);}
.copy-btn{background:var(--purple);}

.mode-switch{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.mode-btn{
  flex:1 1 180px;
  background:var(--gray);
}
.mode-btn.active-prep{
  background:var(--green);
}
.mode-btn.active-field{
  background:var(--blue);
}
.dept-btn.active{
  background:var(--purple);
}

.mode-status,
.current-project-box,
.box,
.summary-box{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:var(--panel-3);
  border:1px solid var(--line);
  white-space:pre-wrap;
}
.mode-status-label,
.current-project-label{
  color:var(--sub);
  font-size:12px;
  margin-bottom:4px;
}
.mode-status-value,
.current-project-value{
  font-size:16px;
  font-weight:700;
}

.project-card,
.scene-card,
.location-card,
.actor-card,
.prop-card{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:var(--panel-3);
  border:1px solid var(--line);
}
.project-card.active{
  border-color:var(--blue);
  box-shadow:0 0 0 1px rgba(37,99,235,.35) inset;
}

.scene-card{
  position:relative;
  padding-left:18px;
}
.scene-card::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:8px;
  background:#334155;
  border-radius:12px 0 0 12px;
}
.scene-card.label-red::before{background:#ef4444;}
.scene-card.label-blue::before{background:#2563eb;}
.scene-card.label-green::before{background:#22c55e;}
.scene-card.label-yellow::before{background:#eab308;}
.scene-card.label-purple::before{background:#7c3aed;}
.scene-card.label-pink::before{background:#db2777;}

.field-scene-card{
  padding-left:18px;
}
.field-scene-card .item-title{
  font-size:20px;
}
.field-scene-card .item-actions button{
  flex:1 1 150px;
}

.actor-card-inner{
  display:grid;
  grid-template-columns:96px 1fr;
  gap:12px;
  align-items:start;
}
.actor-thumb{
  width:96px;
  height:96px;
  border-radius:12px;
  object-fit:cover;
  background:var(--panel-2);
  border:1px solid var(--line);
}
.actor-thumb-placeholder{
  width:96px;
  height:96px;
  border-radius:12px;
  background:var(--panel-2);
  border:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--sub);
  font-size:12px;
  text-align:center;
  padding:8px;
}

.item-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:8px;
}
.item-meta{
  color:var(--sub);
  font-size:14px;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
}
.item-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}
.item-actions button{
  flex:1 1 120px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:10px;
}
.badge{
  font-size:12px;
  padding:6px 10px;
  border-radius:999px;
  background:#1e293b;
  border:1px solid var(--line);
  color:var(--sub);
}
.badge.done{
  background:rgba(34,197,94,.18);
  color:#dcfce7;
  border-color:rgba(34,197,94,.4);
}
.badge.red{
  background:rgba(239,68,68,.2);
  color:#fee2e2;
  border-color:rgba(239,68,68,.4);
}
.badge.blue{
  background:rgba(37,99,235,.2);
  color:#dbeafe;
  border-color:rgba(37,99,235,.4);
}
.badge.green{
  background:rgba(34,197,94,.2);
  color:#dcfce7;
  border-color:rgba(34,197,94,.4);
}
.badge.yellow{
  background:rgba(234,179,8,.2);
  color:#fef9c3;
  border-color:rgba(234,179,8,.4);
}
.badge.purple{
  background:rgba(124,58,237,.2);
  color:#ede9fe;
  border-color:rgba(124,58,237,.4);
}
.badge.pink{
  background:rgba(219,39,119,.2);
  color:#fbcfe8;
  border-color:rgba(219,39,119,.4);
}

.group-title{
  margin:18px 0 8px;
  font-size:18px;
  color:#93c5fd;
}
.empty-text{
  color:var(--sub);
  padding:8px 0;
}
.hidden{
  display:none !important;
}
.detail-box{
  margin-top:10px;
  padding:10px;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:10px;
}
.meta-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
}
.summary-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}
.summary-item{
  padding:12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--panel-2);
}
.summary-label{
  color:var(--sub);
  font-size:12px;
  margin-bottom:4px;
}
.summary-value{
  font-size:20px;
  font-weight:700;
}
.sticky-field-card{
  position:sticky;
  top:0;
  z-index:10;
}

.field-top-bar{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}
.quick-check-wrap{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  margin-top:12px;
}
.quick-check-box{
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
}
.quick-check-title{
  font-size:14px;
  font-weight:700;
  margin-bottom:8px;
}
.quick-check-list{
  display:grid;
  gap:8px;
}
.quick-check-item{
  display:flex;
  gap:8px;
  align-items:flex-start;
  color:var(--text);
  font-size:14px;
}
.quick-check-item input{
  width:auto;
  margin-top:2px;
}
.field-section-title{
  margin:18px 0 8px;
  font-size:16px;
  font-weight:700;
  color:#cbd5e1;
}
.field-divider{
  height:1px;
  background:var(--line);
  margin:14px 0;
}

.scene-check-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
  margin-top:8px;
}
.scene-check-item{
  display:flex;
  gap:8px;
  align-items:flex-start;
  color:var(--text);
  font-size:14px;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 12px;
}
.scene-check-item input{
  width:auto;
  margin-top:2px;
}
.scene-check-badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px;
}
.scene-check-badge{
  font-size:12px;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#1e293b;
  color:var(--sub);
}
.scene-check-badge.on{
  background:rgba(34,197,94,.18);
  color:#dcfce7;
  border-color:rgba(34,197,94,.4);
}

@media (min-width:700px){
  .two-col{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .meta-grid{
    grid-template-columns:1fr 1fr;
  }
  .summary-grid{
    grid-template-columns:1fr 1fr 1fr;
  }
  .field-top-bar{
    grid-template-columns:1fr 1fr;
  }
  .quick-check-wrap{
    grid-template-columns:1fr 1fr;
  }
  .scene-check-grid{
    grid-template-columns:1fr 1fr;
  }
}


</style>
</head>
<body>
<div class="app">

  <header class="app-header">
    <h1>Sukikatte Studio</h1>
    <p class="subtitle">黒UI 安定版 / 1ファイル土台 / 現場モード強化版</p>
  </header>

  <section class="card">
    <h2>モード切替</h2>
    <div class="mode-switch">
      <button type="button" id="prepBtn" class="mode-btn">準備モード</button>
      <button type="button" id="fieldBtn" class="mode-btn">現場モード</button>
    </div>
    <div class="mode-status">
      <div class="mode-status-label">現在のモード</div>
      <div id="modeLabel" class="mode-status-value">未切替</div>
    </div>
  </section>

  <section class="card" id="departmentSection">
    <h2>部署</h2>
    <div class="mode-switch">
      <button type="button" class="mode-btn dept-btn active" data-dept="all">ALL</button>
      <button type="button" class="mode-btn dept-btn" data-dept="direction">演出部</button>
      <button type="button" class="mode-btn dept-btn" data-dept="camera">撮影部</button>
      <button type="button" class="mode-btn dept-btn" data-dept="light">照明部</button>
      <button type="button" class="mode-btn dept-btn" data-dept="make">メイク部</button>
      <button type="button" class="mode-btn dept-btn" data-dept="costume">衣装部</button>
      <button type="button" class="mode-btn dept-btn" data-dept="art">美術部</button>
      <button type="button" class="mode-btn dept-btn" data-dept="production">制作部</button>
      <button type="button" class="mode-btn dept-btn" data-dept="actor">俳優部</button>
    </div>
    <div class="mode-status">
      <div class="mode-status-label">現在の部署</div>
      <div id="deptLabel" class="mode-status-value">ALL</div>
    </div>
  </section>

  <section class="card" id="projectCreateSection">
    <h2>プロジェクト作成</h2>

    <div class="field">
      <label for="projectTitle">プロジェクト名</label>
      <input id="projectTitle" placeholder="例：覚えてなくていい">
    </div>

    <div class="field">
      <label for="projectDirector">監督名</label>
      <input id="projectDirector" placeholder="例：菅原昌規">
    </div>

    <div class="field">
      <label for="projectMemo">プロジェクトメモ</label>
      <textarea id="projectMemo" placeholder="例：短編 2日撮影 夜シーン多め"></textarea>
    </div>

    <div class="button-row">
      <button type="button" id="saveProjectBtn" class="primary-btn">プロジェクト保存</button>
      <button type="button" id="clearProjectBtn" class="secondary-btn">クリア</button>
    </div>
  </section>

  <section class="card" id="projectListSection">
    <h2>プロジェクト一覧</h2>

    <div class="current-project-box">
      <div class="current-project-label">選択中プロジェクト</div>
      <div id="currentProjectLabel" class="current-project-value">未選択</div>
    </div>

    <div id="projectList"></div>
  </section>

  <section class="card" id="locationMasterSection">
    <h2>ロケ地マスタ</h2>

    <div class="field">
      <label for="locationName">ロケ地名</label>
      <input id="locationName" placeholder="例：居酒屋かつら">
    </div>

    <div class="field">
      <label for="locationAddress">住所</label>
      <input id="locationAddress" placeholder="例：東京都渋谷区○○1-2-3">
    </div>

    <div class="field">
  <label for="locationPhone">電話番号</label>
  <input id="locationPhone" placeholder="例：03-1234-5678">
</div>

    <div class="field">
      <label for="locationMapUrl">GoogleマップURL</label>
      <input id="locationMapUrl" placeholder="https://maps.google.com/...">
    </div>

    <div class="field">
      <label for="locationPermitMemo">ロケ許可メモ</label>
      <textarea id="locationPermitMemo" placeholder="例：店長確認済み 申請書送付済み"></textarea>
    </div>

    <div class="field">
      <label for="locationParkingMemo">駐車場メモ</label>
      <textarea id="locationParkingMemo" placeholder="例：近隣コインPあり 店前2台まで"></textarea>
    </div>

    <div class="field">
      <label for="locationPowerMemo">電源メモ</label>
      <textarea id="locationPowerMemo" placeholder="例：店内コンセント使用可 延長コード必要"></textarea>
    </div>

    <div class="field">
      <label for="locationToiletMemo">トイレメモ</label>
      <textarea id="locationToiletMemo" placeholder="例：店内あり 共用部のみ"></textarea>
    </div>

    <div class="field">
      <label for="locationRainMemo">雨天時メモ</label>
      <textarea id="locationRainMemo" placeholder="例：雨天時は店内寄りで対応"></textarea>
    </div>

    <div class="button-row">
      <button type="button" id="saveLocationBtn" class="primary-btn">ロケ地保存</button>
      <button type="button" id="clearLocationBtn" class="secondary-btn">クリア</button>
    </div>

    <div id="locationList"></div>
  </section>

  <section class="card" id="actorMasterSection">
    <h2>俳優一覧</h2>

    <div class="field">
      <label for="actorName">俳優名</label>
      <input id="actorName" placeholder="例：岡本尚子">
    </div>

    <div class="field">
      <label for="actorImageUrl">写真URL</label>
      <input id="actorImageUrl" placeholder="https://example.com/actor.jpg">
    </div>

    <div class="field">
      <label for="actorMemo">俳優メモ</label>
      <textarea id="actorMemo" placeholder="例：高校生役 ナチュラル 一人称は僕"></textarea>
    </div>

    <div class="button-row">
      <button type="button" id="saveActorBtn" class="primary-btn">俳優保存</button>
      <button type="button" id="clearActorBtn" class="secondary-btn">クリア</button>
    </div>

    <div id="actorList"></div>
  </section>

  <section class="card" id="propMasterSection">
    <h2>小道具マスタ</h2>

    <div class="field">
      <label for="propName">小道具名</label>
      <input id="propName" placeholder="例：グラス">
    </div>

    <div class="field">
      <label for="propStorage">保管場所</label>
      <input id="propStorage" placeholder="例：自宅棚A / 事務所箱2">
    </div>

    <div class="field">
      <label for="propMemo">小道具メモ</label>
      <textarea id="propMemo" placeholder="例：割れやすい 予備あり"></textarea>
    </div>

    <div class="button-row">
      <button type="button" id="savePropBtn" class="primary-btn">小道具保存</button>
      <button type="button" id="clearPropBtn" class="secondary-btn">クリア</button>
    </div>

    <div id="propList"></div>
  </section>

  <section class="card" id="sceneFormSection">
    <h2 id="sceneFormTitle">シーン入力</h2>

    <div class="field">
      <label for="sceneProjectSelect">プロジェクト</label>
      <select id="sceneProjectSelect"></select>
    </div>

    <div class="field">
      <label for="sceneLocationSelect">ロケ地マスタ選択</label>
      <select id="sceneLocationSelect"></select>
    </div>

    <div class="button-row">
      <button type="button" id="applyLocationBtn" class="select-btn">ロケ地情報を反映</button>
    </div>

    <div class="field">
      <label for="sceneActorSelect">俳優一覧から追加</label>
      <select id="sceneActorSelect"></select>
    </div>

    <div class="button-row">
      <button type="button" id="applyActorBtn" class="select-btn">出演者に追加</button>
    </div>

    <div class="field">
      <label for="scenePropSelect">小道具一覧から追加</label>
      <select id="scenePropSelect"></select>
    </div>

    <div class="button-row">
      <button type="button" id="applyPropBtn" class="select-btn">小道具に追加</button>
    </div>

    <div class="two-col">
      <div class="field">
        <label for="sceneNo">シーン番号</label>
        <input id="sceneNo" placeholder="例：1">
      </div>

      <div class="field">
        <label for="sceneOrder">撮影順</label>
        <input id="sceneOrder" type="number" placeholder="例：1">
      </div>
    </div>

    <div class="field">
      <label for="sceneTitle">シーン名</label>
      <input id="sceneTitle" placeholder="例：店内 会話シーン">
    </div>

    <div class="field">
      <label for="sceneLabel">色分けラベル</label>
      <select id="sceneLabel">
        <option value="">なし</option>
        <option value="赤">赤</option>
        <option value="青">青</option>
        <option value="緑">緑</option>
        <option value="黄">黄</option>
        <option value="紫">紫</option>
        <option value="ピンク">ピンク</option>
      </select>
    </div>

    <div class="field">
      <label for="sceneCast">出演者</label>
      <textarea id="sceneCast" placeholder="例：岡本尚子 長嶋琢磨"></textarea>
    </div>

    <div class="field">
      <label for="sceneLocation">ロケ場所</label>
      <input id="sceneLocation" placeholder="例：居酒屋かつら">
    </div>

    <div class="field">
      <label for="sceneAddress">住所</label>
      <input id="sceneAddress" placeholder="例：東京都渋谷区○○1-2-3">
    </div>

    <div class="field">
  <label for="scenePhone">電話番号</label>
  <input id="scenePhone" placeholder="例：03-1234-5678">
</div>

    <div class="field">
      <label for="sceneMapUrl">GoogleマップURL</label>
      <input id="sceneMapUrl" placeholder="https://maps.google.com/...">
    </div>

    <div class="field">
      <label for="scenePermitMemo">ロケ許可メモ</label>
      <textarea id="scenePermitMemo" placeholder="例：店長確認済み 申請書送付済み"></textarea>
    </div>

    <div class="field">
      <label for="sceneParkingMemo">駐車場メモ</label>
      <textarea id="sceneParkingMemo" placeholder="例：近隣コインPあり"></textarea>
    </div>

    <div class="field">
      <label for="scenePowerMemo">電源メモ</label>
      <textarea id="scenePowerMemo" placeholder="例：店内コンセント使用可"></textarea>
    </div>

    <div class="field">
      <label for="sceneToiletMemo">トイレメモ</label>
      <textarea id="sceneToiletMemo" placeholder="例：店内あり"></textarea>
    </div>

    <div class="field">
      <label for="sceneRainMemo">雨天時メモ</label>
      <textarea id="sceneRainMemo" placeholder="例：雨天時は店内寄りで対応"></textarea>
    </div>

    <div class="field">
      <label for="sceneProp">小道具</label>
      <textarea id="sceneProp" placeholder="例：グラス メニュー表 財布"></textarea>
    </div>

    <div class="field">
      <label for="sceneMemo">共通メモ</label>
      <textarea id="sceneMemo" placeholder="例：重要シーン 先に撮る"></textarea>
    </div>

    <div class="field">
  <label>シーンチェック</label>
  <div class="scene-check-grid">
    <label class="scene-check-item"><input type="checkbox" id="sceneCheckSchedule"> 香盤確認</label>
    <label class="scene-check-item"><input type="checkbox" id="sceneCheckProp"> 小道具OK</label>
    <label class="scene-check-item"><input type="checkbox" id="sceneCheckCast"> 出演者OK</label>
    <label class="scene-check-item"><input type="checkbox" id="sceneCheckCostume"> 衣装メイクOK</label>
    <label class="scene-check-item"><input type="checkbox" id="sceneCheckCamera"> カメラOK</label>
    <label class="scene-check-item"><input type="checkbox" id="sceneCheckLight"> 照明OK</label>
  </div>
</div>

    <div class="field" id="directionNoteField">
      <label for="sceneDirectionNote">演出部メモ</label>

  function uid(prefix){
    return `${prefix}_${Date.now()}_${Math.floor(Math.random() * 100000)}`;

  function escapeHtml(value){
    return String(value ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function labelClass(label){
    if(label === "赤") return "label-red";
    if(label === "青") return "label-blue";

    if(label === "黄") return "label-yellow";
    if(label === "紫") return "label-purple";
    if(label === "ピンク") return "label-pink";
    return "";
  }

      const lightNoteField = $("lightNoteField");
      const productionNoteField = $("productionNoteField");

      if(cameraNoteField) cameraNoteField.classList.add("hidden");
      if(lightNoteField) lightNoteField.classList.add("hidden");
      if(productionNoteField) productionNoteField.classList.add("hidden");
      if(actorNoteField) actorNoteField.classList.add("hidden");

    const directionNoteField = $("directionNoteField");

    const lightNoteField = $("lightNoteField");
    const productionNoteField = $("productionNoteField");

      projectCreateSection.classList.toggle("hidden", !(showAll || currentDept === "direction"));

      sceneFormSection.classList.toggle(

  function addProject(){
    const title = projectTitle.value.trim();
    const director = projectDirector.value.trim();
    const memo = projectMemo.value.trim();

    if(!title){
      alert("プロジェクト名は必須です");
      return;
    }

    projects.push({ id: uid("project"), title, director, memo });
    saveProjects();

    if(!activeProjectId){
      activeProjectId = projects[0].id;
      saveActiveProject();
    }

    clearProjectForm();
    renderProjects();
    renderProjectSelect();
    renderFieldProjectFilter();
    renderScenes();
    renderDebug();
  }

  function deleteProject(projectId){
    const hasScenes = scenes.some(scene => scene.projectId === projectId);
    const message = hasScenes
      ? "このプロジェクトを削除すると紐づくシーンも削除されます 削除する？"
      : "このプロジェクトを削除する？";

    if(!confirm(message)) return;

    projects = projects.filter(project => project.id !== projectId);
    scenes = scenes.filter(scene => scene.projectId !== projectId);

    saveProjects();
    saveScenes();

    if(activeProjectId === projectId){
      activeProjectId = projects[0]?.id || "";
      saveActiveProject();
    }

    renderProjects();
    renderProjectSelect();
    renderFieldProjectFilter();
    renderScenes();
    renderDebug();
  }

  function selectProject(projectId){
    activeProjectId = projectId;
    saveActiveProject();
    renderProjects();
    renderProjectSelect();
    renderScenes();
    renderDebug();
  }

  function renderProjects(){
    if(projects.length === 0){
      projectList.innerHTML = `<div class="empty-text">プロジェクトがまだありません</div>`;
      currentProjectLabel.textContent = "未選択";
      return;
    }

    const sorted = [...projects].sort((a, b) => a.title.localeCompare(b.title, "ja"));

    projectList.innerHTML = sorted.map(project => {
      const projectScenes = scenes.filter(scene => scene.projectId === project.id);
      return `
        <div class="project-card ${project.id === activeProjectId ? "active" : ""}">
          <div class="item-title">${escapeHtml(project.title)}</div>
          <div class="item-meta">監督：${escapeHtml(project.director || "-")}</div>
          <div class="item-meta">シーン数：${projectScenes.length}</div>
          <div class="item-meta">${escapeHtml(project.memo || "-")}</div>
          <div class="item-actions">
            <button type="button" class="select-btn" data-project-select="${project.id}">使う</button>
            <button type="button" class="danger-btn" data-project-delete="${project.id}">削除</button>
          </div>
        </div>
      `;
    }).join("");

    const current = projects.find(project => project.id === activeProjectId);
    currentProjectLabel.textContent = current ? current.title : "未選択";

    projectList.querySelectorAll("[data-project-select]").forEach(btn => {
      btn.addEventListener("click", () => selectProject(btn.getAttribute("data-project-select")));
    });

    projectList.querySelectorAll("[data-project-delete]").forEach(btn => {
      btn.addEventListener("click", () => deleteProject(btn.getAttribute("data-project-delete")));
    });
  }

  function renderProjectSelect(){
    if(projects.length === 0){
      sceneProjectSelect.innerHTML = `<option value="">先にプロジェクトを作成してください</option>`;
      return;
    }

    const sorted = [...projects].sort((a, b) => a.title.localeCompare(b.title, "ja"));

    sceneProjectSelect.innerHTML = sorted.map(project => `
      <option value="${project.id}">${escapeHtml(project.title)}</option>
    `).join("");

    if(sorted.some(project => project.id === activeProjectId)){
      sceneProjectSelect.value = activeProjectId;
    }else{
      sceneProjectSelect.value = sorted[0].id;
    }
  }

  function renderFieldProjectFilter(){
    const currentValue = fieldProjectFilter.value || "all";

    if(projects.length === 0){
      fieldProjectFilter.innerHTML = `<option value="all">すべてのプロジェクト</option>`;
      fieldProjectFilter.value = "all";
      return;
    }

    const sorted = [...projects].sort((a, b) => a.title.localeCompare(b.title, "ja"));
    fieldProjectFilter.innerHTML = `
      <option value="all">すべてのプロジェクト</option>
      ${sorted.map(project => `<option value="${project.id}">${escapeHtml(project.title)}</option>`).join("")}
    `;

    if([...fieldProjectFilter.options].some(option => option.value === currentValue)){
      fieldProjectFilter.value = currentValue;
    }else{
      fieldProjectFilter.value = "all";
    }
  }

  function addLocation(){
    const locationObject = {
  id: editingLocationId || uid("location"),
  name: locationName.value.trim(),
  address: locationAddress.value.trim(),
  phone: locationPhone.value.trim(),
  mapUrl: locationMapUrl.value.trim(),
  permitMemo: locationPermitMemo.value.trim(),
  parkingMemo: locationParkingMemo.value.trim(),
  powerMemo: locationPowerMemo.value.trim(),
  toiletMemo: locationToiletMemo.value.trim(),
  rainMemo: locationRainMemo.value.trim()
};

    if(!locationObject.name){
      alert("ロケ地名は必須です");
      return;
    }

    if(editingLocationId){
      const index = locations.findIndex(location => location.id === editingLocationId);
      if(index >= 0) locations[index] = locationObject;
    }else{
      locations.push(locationObject);
    }

    saveLocations();
    clearLocationForm();
    renderLocations();
    renderLocationSelect();
    renderDebug();
  }

  function editLocation(locationId){
    const location = locations.find(item => item.id === locationId);
    if(!location) return;

    editingLocationId = location.id;
   locationName.value = location.name || "";
locationAddress.value = location.address || "";

  function getFilteredScenesForField(){
  const search = fieldSearchInput.value.trim().toLowerCase();
  const projectFilter = fieldProjectFilter.value || "all";
  const statusFilter = fieldStatusFilter.value || "all";
  const sortFilter = fieldSortFilter ? fieldSortFilter.value : "default";

  let filtered = [...scenes];

  if(projectFilter !== "all"){
    filtered = filtered.filter(scene => scene.projectId === projectFilter);
  }

  if(statusFilter === "done"){
    filtered = filtered.filter(scene => scene.done);
  }else if(statusFilter === "undone"){
    filtered = filtered.filter(scene => !scene.done);
  }

  if(search){
    filtered = filtered.filter(scene => {
      const text = [
        scene.title,
        scene.no,
        scene.cast,
        scene.location,
        scene.address,
        scene.phone,
        scene.prop,
        scene.memo,
        scene.directionNote,
        scene.cameraNote,
        scene.lightNote,
        scene.productionNote,
        scene.actorNote,
        getProjectTitle(scene.projectId)
      ].join(" ").toLowerCase();

      return text.includes(search);
    });
  }

  filtered.sort((a, b) => {
    if(sortFilter === "orderAsc"){
      const orderDiff = (a.order || 0) - (b.order || 0);
      if(orderDiff !== 0) return orderDiff;
      return String(a.no || "").localeCompare(String(b.no || ""), "ja");
    }

    if(sortFilter === "orderDesc"){
      const orderDiff = (b.order || 0) - (a.order || 0);
      if(orderDiff !== 0) return orderDiff;
      return String(a.no || "").localeCompare(String(b.no || ""), "ja");
    }

    if(sortFilter === "titleAsc"){
      return String(a.title || "").localeCompare(String(b.title || ""), "ja");
    }

    if(a.done !== b.done){
      return a.done ? 1 : -1;
    }

    const orderDiff = (a.order || 0) - (b.order || 0);
    if(orderDiff !== 0) return orderDiff;
    return String(a.no || "").localeCompare(String(b.no || ""), "ja");
  });

  return filtered;
}

      }

      const sortedProjects = [...projects].sort((a, b) => a.title.localeCompare(b.title, "ja"));

      const groups = sortedProjects
        .map(project => {
          const projectScenes = scenes
            .filter(scene => scene.projectId === project.id)
            .sort((a, b) => {
              const orderDiff = (a.order || 0) - (b.order || 0);
              if(orderDiff !== 0) return orderDiff;
              return String(a.no || "").localeCompare(String(b.no || ""), "ja");
            });

          return { project, scenes: projectScenes };
        })
        .filter(group => group.scenes.length > 0);

      if(groups.length === 0){
        sceneList.innerHTML = `<div class="empty-text">シーンがまだありません</div>`;
        return;
      }

      sceneList.innerHTML = groups.map(group => `
        <div class="group-title">${escapeHtml(group.project.title)}</div>
        ${group.scenes.map(scene => `
          <div class="scene-card ${labelClass(scene.label)}">
            <div class="item-title">${escapeHtml(scene.title)}</div>

            <div class="badges">
              ${scene.no ? `<span class="badge">シーン ${escapeHtml(scene.no)}</span>` : ``}
              ${scene.order ? `<span class="badge">撮影順 ${scene.order}</span>` : ``}
              ${scene.label ? `<span class="badge ${badgeClass(scene.label)}">${escapeHtml(scene.label)}</span>` : ``}
              ${scene.done ? `<span class="badge done">完了</span>` : ``}
              ${scene.location ? `<span class="badge">${escapeHtml(scene.location)}</span>` : ``}
            </div>

            <div class="item-meta">出演者：${escapeHtml(scene.cast || "-")}</div>
            <div class="item-meta">小道具：${escapeHtml(scene.prop || "-")}</div>
            <div class="item-meta">場所：${escapeHtml(scene.location || "-")}</div>

            <div id="detail_${scene.id}" class="detail-box hidden">
              <div class="meta-grid">
                <div class="item-meta">住所：${escapeHtml(scene.address || "-")}</div>
                <div class="item-meta">電話番号：${escapeHtml(scene.phone || "-")}</div>
                <div class="item-meta">GoogleマップURL：${escapeHtml(scene.mapUrl || "-")}</div>
                <div class="item-meta">ロケ許可メモ：${escapeHtml(scene.permitMemo || "-")}</div>
                <div class="item-meta">駐車場：${escapeHtml(scene.parkingMemo || "-")}</div>
                <div class="item-meta">電源：${escapeHtml(scene.powerMemo || "-")}</div>
                <div class="item-meta">トイレ：${escapeHtml(scene.toiletMemo || "-")}</div>
                <div class="item-meta">雨天時：${escapeHtml(scene.rainMemo || "-")}</div>
                <div class="item-meta">小道具詳細：${escapeHtml(scene.prop || "-")}</div>
              </div>
              <div class="item-meta">共通メモ：${escapeHtml(scene.memo || "-")}</div>
              <div class="item-meta">演出部メモ：${escapeHtml(scene.directionNote || "-")}</div>
              <div class="item-meta">撮影部メモ：${escapeHtml(scene.cameraNote || "-")}</div>
              <div class="item-meta">照明部メモ：${escapeHtml(scene.lightNote || "-")}</div>
              <div class="item-meta">制作部メモ：${escapeHtml(scene.productionNote || "-")}</div>
              <div class="item-meta">俳優部メモ：${escapeHtml(scene.actorNote || "-")}</div>
            </div>

            <div class="item-actions">
              <button type="button" class="detail-btn" data-scene-detail="${scene.id}">詳細</button>
              <button type="button" class="select-btn" data-scene-done="${scene.id}">${scene.done ? "未完了に戻す" : "完了にする"}</button>
              <button type="button" class="edit-btn" data-scene-edit="${scene.id}">編集</button>
              <button type="button" class="danger-btn" data-scene-delete="${scene.id}">削除</button>
            </div>
          </div>
        `).join("")}
      `).join("");
    }

    sceneList.querySelectorAll("[data-scene-detail]").forEach(btn => {
      btn.addEventListener("click", () => toggleDetail(btn.getAttribute("data-scene-detail")));
    });

    sceneList.querySelectorAll("[data-scene-done]").forEach(btn => {
      btn.addEventListener("click", () => toggleDone(btn.getAttribute("data-scene-done")));
    });

    sceneList.querySelectorAll("[data-scene-edit]").forEach(btn => {
      btn.addEventListener("click", () => editScene(btn.getAttribute("data-scene-edit")));
    });

    sceneList.querySelectorAll("[data-scene-delete]").forEach(btn => {
      btn.addEventListener("click", () => deleteScene(btn.getAttribute("data-scene-delete")));
    });

    sceneList.querySelectorAll("[data-scene-map]").forEach(btn => {
  btn.addEventListener("click", () => {
    const sceneId = btn.getAttribute("data-scene-map");
    const scene = scenes.find(item => item.id === sceneId);
    if(!scene || !scene.mapUrl) return;
    window.open(scene.mapUrl, "_blank");
  });
});
sceneList.querySelectorAll("[data-scene-address]").forEach(btn => {
  btn.addEventListener("click", async () => {
    const sceneId = btn.getAttribute("data-scene-address");
    const scene = scenes.find(item => item.id === sceneId);
    if(!scene || !scene.address) return;

    try{
      await navigator.clipboard.writeText(scene.address);
      alert("住所をコピーしました");
    }catch(error){
      const temp = document.createElement("textarea");
      temp.value = scene.address;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand("copy");
      document.body.removeChild(temp);
      alert("住所をコピーしました");
    }
  });
});

sceneList.querySelectorAll("[data-scene-phone]").forEach(btn => {
  btn.addEventListener("click", async () => {
    const sceneId = btn.getAttribute("data-scene-phone");
    const scene = scenes.find(item => item.id === sceneId);
    if(!scene || !scene.phone) return;

    try{
      await navigator.clipboard.writeText(scene.phone);
      alert("電話番号をコピーしました");
    }catch(error){
      const temp = document.createElement("textarea");
      temp.value = scene.phone;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand("copy");
      document.body.removeChild(temp);
      alert("電話番号をコピーしました");
    }
  });
});
        sceneList.querySelectorAll("[data-scene-check-toggle]").forEach(btn => {
      btn.addEventListener("click", () => {
        toggleSceneCheck(
          btn.getAttribute("data-scene-check-toggle"),
          btn.getAttribute("data-check-key")
        );
      });
    });
  }

  function renderDebug(){
    debugBox.textContent =
      "script: OK\n" +
      "mode: " + mode + "\n" +
      "currentDept: " + currentDept + "\n" +
      "projects: " + projects.length + "\n" +
      "locations: " + locations.length + "\n" +
      "actors: " + actors.length + "\n" +
      "props: " + props.length + "\n" +
      "scenes: " + scenes.length + "\n" +
      "editingLocationId: " + (editingLocationId || "なし") + "\n" +
      "editingActorId: " + (editingActorId || "なし") + "\n" +
      "editingPropId: " + (editingPropId || "なし") + "\n" +
      "editingSceneId: " + (editingSceneId || "なし") + "\n" +
      "activeProjectId: " + (activeProjectId || "なし");
  }

  prepBtn.addEventListener("click", () => setMode("prep"));
  fieldBtn.addEventListener("click", () => setMode("field"));

  document.querySelectorAll(".dept-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      setDept(btn.getAttribute("data-dept"));
    });
  });

  saveProjectBtn.addEventListener("click", addProject);
  clearProjectBtn.addEventListener("click", clearProjectForm);

  saveLocationBtn.addEventListener("click", addLocation);
  clearLocationBtn.addEventListener("click", clearLocationForm);
  applyLocationBtn.addEventListener("click", applyLocationToScene);

  saveActorBtn.addEventListener("click", addActor);
  clearActorBtn.addEventListener("click", clearActorForm);
  applyActorBtn.addEventListener("click", applyActorToScene);

  savePropBtn.addEventListener("click", addProp);
  clearPropBtn.addEventListener("click", clearPropForm);
  applyPropBtn.addEventListener("click", applyPropToScene);

  saveSceneBtn.addEventListener("click", addScene);
  clearSceneBtn.addEventListener("click", clearSceneForm);

fieldSearchInput.addEventListener("input", renderScenes);
fieldProjectFilter.addEventListener("change", renderScenes);
fieldStatusFilter.addEventListener("change", renderScenes);
fieldSortFilter.addEventListener("change", renderScenes);
clearFieldFilterBtn.addEventListener("click", clearFieldFilters);
document.querySelectorAll(".quick-check-item input").forEach(input => {
  input.addEventListener("change", () => {
    quickCheck[input.id] = input.checked;
    saveQuickCheck();
  });
});

  renderMode();
  setDept("all");
  renderProjects();
  renderProjectSelect();
  renderFieldProjectFilter();
  renderLocations();
  renderLocationSelect();
  renderActors();
  renderActorSelect();
  renderProps();
  renderPropSelect();
  renderScenes();
  renderDebug();
  applyQuickCheck();
})();
</script>
</body>
</html>
